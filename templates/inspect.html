<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inspection</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f2f4f7; color: #222; }
  header { background: #1F4E78; color: #fff; padding: 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card.done { border: 2px solid #2e7d32; }
  .gname { font-size: 17px; font-weight: bold; }
  .gmeta { font-size: 13px; color: #666; margin: 4px 0 10px; }
  .btn { display: block; width: 100%; padding: 14px; font-size: 17px; border: none; border-radius: 10px; margin-top: 8px; cursor: pointer; }
  .btn-cam { background: #1F4E78; color: #fff; }
  .btn-ok { background: #2e7d32; color: #fff; }
  .btn-edit { background: #e0e0e0; color: #222; }
  .sec { font-size: 15px; font-weight: bold; color: #1F4E78; margin: 18px 4px 8px; }
  .sec small { color: #666; font-weight: normal; }
  .val { font-size: 34px; font-weight: bold; color: #1F4E78; margin: 8px 0; }
  .thumb { width: 100%; border-radius: 8px; margin-top: 8px; }
  .row { display: flex; gap: 8px; }
  input[type=text], input[type=number] { width: 100%; padding: 12px; font-size: 17px; border: 1px solid #bbb; border-radius: 8px; margin-top: 8px; }
  .prog { position: sticky; top: 0; background: #1F4E78; color: #fff; text-align: center; font-size: 15px; font-weight: bold; padding: 10px; }
  .bar { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; margin-top: 6px; }
  .bar > div { height: 6px; background: #7fd67f; border-radius: 3px; width: 0; }
  .warn { background: #fff8e1; border: 1px solid #f0c36d; border-radius: 8px; padding: 10px; font-size: 13px; margin-top: 8px; }
  .ok-badge { color: #2e7d32; font-weight: bold; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 12px 20px; border-radius: 24px; display: none; font-size: 15px; z-index: 50; }
  .topbtns { display: flex; gap: 8px; margin-bottom: 4px; }
  .topbtns a, .topbtns button { flex: 1; text-align: center; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid #bbb; background: #fff; color: #333; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Inspection</h1>
  <p id="subtitle"></p>
</header>
<div class="prog"><span id="progText">Loading...</span><div class="bar"><div id="progBar"></div></div></div>
<main>
  <div class="card">
    <div style="font-size:14px;color:#555;margin-bottom:4px">Worker name</div>
    <input type="text" id="worker" placeholder="e.g. John" style="margin-top:0">
  </div>
  <div class="topbtns">
    <a href="/">‹ Change boilers</a>
    <button id="resetBtn">Reset today's checks</button>
  </div>
  <div id="list"></div>
</main>
<div id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const BOILERS = (params.get("boilers") || "").split(",").filter(Boolean);
const PUMPS = (params.get("pumps") || "").split(",").filter(Boolean);
const HAS_PUMPS_PARAM = params.has("pumps");
const TODAY = new Date().toISOString().slice(0, 10);
const DONE_KEY = "done_inspect_" + TODAY;
let doneSet = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]"));
let items = [];
let gaugeMap = {};

worker.value = localStorage.getItem("worker") || "";
worker.onchange = () => localStorage.setItem("worker", worker.value);

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function updateProg() {
  const all = Object.keys(gaugeMap);
  const done = all.filter(id => doneSet.has(id)).length;
  document.getElementById("progText").textContent = all.length ? `${done} / ${all.length} gauges done` : "No gauges";
  document.getElementById("progBar").style.width = all.length ? (done / all.length * 100) + "%" : "0";
}

async function load() {
  if (!BOILERS.length && !PUMPS.length) { location.href = "/"; return; }
  document.getElementById("subtitle").textContent =
    "Boilers: " + (BOILERS.join(", ") || "—") + " · Pumps: " + (PUMPS.join(", ") || "—");
  const q = "boilers=" + BOILERS.join(",") + (HAS_PUMPS_PARAM ? "&pumps=" + PUMPS.join(",") : "");
  const r = await fetch("/api/inspect?" + q);
  const d = await r.json();
  items = d.items;
  const box = document.getElementById("list");
  box.innerHTML = "";
  items.forEach(it => {
    const sec = document.createElement("div");
    sec.className = "sec";
    sec.innerHTML = `${esc(it.name)} <small>· ${esc(it.id)} · ${it.gauges.length} gauges</small>`;
    box.appendChild(sec);
    it.gauges.forEach(g => {
      gaugeMap[g.id] = { g, equip: it };
      const card = document.createElement("div");
      card.className = "card" + (doneSet.has(g.id) ? " done" : "");
      card.id = "card-" + g.id;
      card.innerHTML = `
        <div class="gname">${doneSet.has(g.id) ? '<span class="ok-badge">✓</span> ' : ""}${esc(g.name)}</div>
        <div class="gmeta">${esc(it.name)} · ${esc(g.item || "Item not registered")} ${g.unit ? "· " + esc(g.unit) : ""}${g.calibrated ? "" : ' · <span style="color:#b26a00">Calibration needed</span>'}</div>
        <div class="res" style="display:none"></div>
        <input type="file" accept="image/*" capture="environment" style="display:none" id="file-${g.id}">
        <button class="btn btn-cam" onclick="shoot('${g.id}')">📷 Take photo</button>`;
      box.appendChild(card);
      card.querySelector("input").addEventListener("change", ev => onPhoto(g.id, ev.target.files[0]));
    });
  });
  updateProg();
}

function shoot(gid) { document.getElementById("file-" + gid).click(); }

async function shrinkPhoto(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    bmp.close();
    return blob || file;
  } catch (e) { return file; }
}

async function onPhoto(gid, file) {
  if (!file) return;
  const { g, equip } = gaugeMap[gid];
  const card = document.getElementById("card-" + gid);
  const res = card.querySelector(".res");
  res.style.display = "block";
  res.innerHTML = `<img class="thumb" id="thumb-${gid}"><div style="margin-top:8px;color:#666">Uploading / reading...</div>`;
  document.getElementById("thumb-" + gid).src = URL.createObjectURL(file);

  const small = await shrinkPhoto(file);
  const fd = new FormData();
  fd.append("gauge_id", gid);
  fd.append("photo", small, "photo.jpg");
  let data;
  try {
    const r = await fetch("/api/read", { method: "POST", body: fd });
    data = await r.json();
  } catch (e) { data = { error: "Server connection failed" }; }

  if (data.error) {
    res.innerHTML += `<div class="warn">Read failed: ${esc(data.error)}<br>Please enter the value manually below.</div>` + manualHtml(gid, "");
    return;
  }
  window["_last_" + gid] = { data, equip };
  let html = "";
  if (data.value == null) {
    html = `<div class="warn">Auto read: needle angle ${data.angle_deg}° (not calibrated — please enter the value manually)</div>` + manualHtml(gid, "");
  } else {
    html = `<div class="val">${data.value} <span style="font-size:18px">${esc(data.unit || "")}</span></div>
      <div style="font-size:12px;color:#888">Needle angle ${data.angle_deg}° · auto read</div>
      <div class="row">
        <button class="btn btn-ok" onclick="confirmReading('${gid}', false)">✓ Confirm</button>
        <button class="btn btn-edit" onclick="showManual('${gid}')">Manual entry</button>
      </div>
      <div class="manual" style="display:none">${manualHtml(gid, data.value)}</div>`;
  }
  res.innerHTML = `<img class="thumb" src="${document.getElementById("thumb-" + gid).src}">` + html;
}

function manualHtml(gid, preset) {
  return `<input type="number" step="any" id="manual-${gid}" placeholder="Enter value" value="${preset == null ? "" : preset}">
    <button class="btn btn-ok" onclick="confirmReading('${gid}', true)">✓ Save</button>`;
}
function showManual(gid) {
  const m = document.querySelector("#card-" + gid + " .manual");
  if (m) m.style.display = "block";
}

async function confirmReading(gid, manual) {
  const { g, equip } = gaugeMap[gid];
  const last = window["_last_" + gid] || {};
  const data = last.data || {};
  let value = data.value;
  if (manual) {
    value = document.getElementById("manual-" + gid).value;
    if (value === "" || value == null) { toast("Please enter a value"); return; }
  }
  const body = {
    equip_id: equip.id, gauge_id: gid, value: value,
    unit: g.unit || data.unit || "",
    angle_deg: data.angle_deg || "", state: "Running",
    worker: worker.value || "", photo: data.photo || "", manual: manual
  };
  try {
    await fetch("/api/log", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  } catch (e) { toast("Save failed — please try again"); return; }
  doneSet.add(gid);
  localStorage.setItem(DONE_KEY, JSON.stringify([...doneSet]));
  const card = document.getElementById("card-" + gid);
  card.classList.add("done");
  const name = card.querySelector(".gname");
  if (!name.innerHTML.includes("ok-badge")) name.innerHTML = '<span class="ok-badge">✓</span> ' + name.innerHTML;
  toast("Saved ✓");
  updateProg();
}

document.getElementById("resetBtn").onclick = () => {
  if (confirm("Reset today's checks?")) {
    doneSet = new Set();
    localStorage.setItem(DONE_KEY, "[]");
    load();
  }
};

load();
</script>
</body>
</html>
